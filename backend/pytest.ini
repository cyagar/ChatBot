[pytest]
asyncio_default_fixture_loop_scope = function
testpaths = tests
markers =
    slow: exercises the real embedding model (network/model-load on first run)
    live_drive: talks to a real Google Drive folder over the network -- never run by default (P1-1); requires TMA_LIVE_DRIVE_TEST=1 plus real credentials, gated inside the test itself so a bare `pytest` or `pytest -m ""` still cannot reach the network
