name: Backend CI

# Runs the full backend/tests suite against a PostgreSQL 16 service container.
# No secrets or external services are needed: AI_PROVIDER is forced to
# local_extractive and Google Drive is left unconfigured by tests/conftest.py's
# test_env fixture.

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # An ephemeral Postgres service container, torn down with the job, is
    # what test_env's own TRUNCATE ... CASCADE runs against below -- never a
    # Neon branch or any other persistent database, so there is nothing here
    # a bad run could damage beyond this one job (tests/conftest.py's
    # test_env fixture refuses to run against nothing, or worse, silently
    # fall back to a developer's real backend/.env). Only one job today, so
    # isolated databases per parallel job doesn't yet apply -- there's no
    # parallelism to isolate; add a per-job database name if/when a matrix
    # is introduced.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          # Matches Dockerfile's python:3.12-slim -- the documented production
          # target, not the 3.14 used for local Windows dev (see Dockerfile's
          # own comment on this). CI validates what will actually run.
          python-version: "3.12"
          # Not using setup-python's built-in cache: "pip" -- the first real
          # run of this workflow failed at "Post Run actions/setup-python@v5"
          # (its automatic cache-save step) even though every actual test
          # step passed, which would fail this job on a caching hiccup alone.
          # Explicit actions/cache steps below, each with continue-on-error,
          # get the same speed-up without a cache-save failure ever failing
          # the build.

      - name: Cache pip packages
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/requirements.txt', 'backend/requirements-dev.txt') }}

      # embedding_model_revision in app/config.py is a pinned commit SHA, not
      # a branch -- caching this key is safe from silently picking up a
      # different model later, and turns every run after the first into a
      # cache hit instead of a fresh Hugging Face download.
      - name: Cache embedding model
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.cache/huggingface
          key: hf-embedding-model-${{ hashFiles('backend/app/config.py') }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1
        # tesseract-ocr (also apt-installed in the Dockerfile) is deliberately
        # not installed here: no test in backend/tests/ exercises real OCR
        # (grepped for it before adding this workflow), only libgl1 is needed
        # for the same reason the Dockerfile needs it (an image-handling
        # dependency's import path, not anything OCR-specific).

      - name: Install Python dependencies
        # requirements-dev.txt pulls in requirements.txt itself plus
        # pytest/httpx -- this job needs both, unlike the Dockerfile, which
        # only ever installs requirements.txt for the deployed image.
        run: |
          pip install --no-cache-dir torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r requirements-dev.txt

      - name: Write backend/.env.test for the ephemeral Postgres service
        # A plain postgres:// DSN, not a Neon one -- tests/conftest.py's
        # production-DSN guard (test_env fixture) compares this against
        # backend/.env's real DATABASE_URL and refuses to run if they ever
        # match; CI has no backend/.env at all, so that guard is a no-op
        # here, and this service container is never reachable from outside
        # this job in any case.
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/tma_test" >> .env.test
          echo "DATABASE_URL_UNPOOLED=postgresql://postgres:postgres@localhost:5432/tma_test" >> .env.test

      - name: Run backend test suite
        run: pytest -q
