name: Android release

# Manually triggered. Fails outright when any signing secret is missing, so a
# green run always means a signed APK was produced and verified.

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      TECHMANUAL_BASE_URL_RELEASE: ${{ secrets.TECHMANUAL_BASE_URL_RELEASE }}
      TECHMANUAL_RELEASE_STORE_FILE_BASE64: ${{ secrets.TECHMANUAL_RELEASE_STORE_FILE_BASE64 }}
      TECHMANUAL_RELEASE_STORE_FILE: keystore/release.jks
      TECHMANUAL_RELEASE_STORE_PASSWORD: ${{ secrets.TECHMANUAL_RELEASE_STORE_PASSWORD }}
      TECHMANUAL_RELEASE_KEY_ALIAS: ${{ secrets.TECHMANUAL_RELEASE_KEY_ALIAS }}
      TECHMANUAL_RELEASE_KEY_PASSWORD: ${{ secrets.TECHMANUAL_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Require every release secret
        run: |
          missing=0
          for name in TECHMANUAL_BASE_URL_RELEASE TECHMANUAL_RELEASE_STORE_FILE_BASE64 \
                      TECHMANUAL_RELEASE_STORE_PASSWORD TECHMANUAL_RELEASE_KEY_ALIAS \
                      TECHMANUAL_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret $name"
              missing=1
            fi
          done
          exit $missing

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Android SDK Platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run JVM unit tests and lint
        run: ./gradlew testDebugUnitTest lintRelease --console=plain

      - name: Decode the release keystore
        run: |
          mkdir -p keystore
          echo "$TECHMANUAL_RELEASE_STORE_FILE_BASE64" | base64 -d > keystore/release.jks

      - name: Build the signed release APK
        run: ./gradlew assembleRelease --console=plain

      - name: Verify signing and inspect the APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -E "^package:|^application-label:"
          sha256sum "$APK"

      - name: Upload the release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
