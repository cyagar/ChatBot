name: Android CI

# Debug build and JVM unit tests run with zero configuration (debug falls back
# to the emulator alias backend URL). Connected/emulator tests are not run here.
# Signed release builds live in android-release.yml.

on:
  push:
    branches: [master]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      # Only the Gradle daemon needs JDK 25 (gradle/gradle-daemon-jvm.properties
      # auto-provisions it via the foojay resolver, confirmed working locally
      # even with an old launcher JVM -- see android/README.md's Prerequisites
      # section) -- the launcher JVM setup-java provides here doesn't need to
      # match it.
      - uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      # Package IDs confirmed against this project's own local SDK install
      # (platforms/android-37.0/package.xml, build-tools/36.0.0/package.xml)
      # -- "platforms;android-37" (no ".0") doesn't exist, and 37.0.0
      # build-tools isn't installed/needed locally; AGP builds compileSdk 37
      # against build-tools 36.0.0 without complaint.
      - name: Install Android SDK Platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile and run JVM unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Build the debug APK
        run: ./gradlew assembleDebug --console=plain
