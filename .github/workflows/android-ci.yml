name: Android CI

# Change set 2 (UpdatedNextSteps.txt section 14): "Add CI for backend and
# Android deterministic checks." Runs assembleDebug + testDebugUnitTest --
# both work with zero configuration (see android/README.md's "Configuring
# the backend endpoint": debug falls back to the emulator alias, no
# local.properties/env var needed). Deliberately does NOT run
# connectedDebugAndroidTest (needs a real device/emulator; a GitHub-hosted
# Android emulator is a real option but a larger addition than this pass
# covers -- left for a follow-up, not silently skipped without saying so).
#
# P1-22 (external review, 2026-09-21): "release APK build is not exercised
# by CI." build-release-candidate below builds, signs, and inspects an
# actual assembleRelease output -- but only once real signing secrets exist
# in this repo's GitHub Actions secrets (TECHMANUAL_RELEASE_STORE_FILE_BASE64
# and friends, below); every step in that job is a no-op until then, so this
# addition cannot break CI today. Setting those secrets, and backing up the
# signing key itself somewhere durable outside this machine, is a decision
# for whoever holds that key -- not something this workflow can do on its
# own. Testing an upgrade install from a previous same-certificate release
# is also still a manual step; this job stops at "produced and verified a
# correctly signed APK," not "confirmed it installs over the last one."

on:
  push:
    branches: [master]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      # Only the Gradle daemon needs JDK 25 (gradle/gradle-daemon-jvm.properties
      # auto-provisions it via the foojay resolver, confirmed working locally
      # even with an old launcher JVM -- see android/README.md's Prerequisites
      # section) -- the launcher JVM setup-java provides here doesn't need to
      # match it.
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # Package IDs confirmed against this project's own local SDK install
      # (platforms/android-37.0/package.xml, build-tools/36.0.0/package.xml)
      # -- "platforms;android-37" (no ".0") doesn't exist, and 37.0.0
      # build-tools isn't installed/needed locally; AGP builds compileSdk 37
      # against build-tools 36.0.0 without complaint.
      - name: Install Android SDK Platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile and run JVM unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Build the debug APK
        run: ./gradlew assembleDebug --console=plain

  build-release-candidate:
    runs-on: ubuntu-latest
    needs: build-and-test
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Android SDK Platform 37
        if: ${{ secrets.TECHMANUAL_RELEASE_STORE_FILE_BASE64 != '' }}
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        if: ${{ secrets.TECHMANUAL_RELEASE_STORE_FILE_BASE64 != '' }}

      # Decoded into android/keystore/release.jks (gitignored -- see
      # android/.gitignore) inside the ephemeral runner workspace only; never
      # written anywhere outside this job, never logged, and the runner
      # itself is discarded after the job finishes.
      - name: Decode the release keystore
        if: ${{ secrets.TECHMANUAL_RELEASE_STORE_FILE_BASE64 != '' }}
        run: |
          mkdir -p keystore
          echo "${{ secrets.TECHMANUAL_RELEASE_STORE_FILE_BASE64 }}" | base64 -d > keystore/release.jks

      - name: Build the signed release APK
        if: ${{ secrets.TECHMANUAL_RELEASE_STORE_FILE_BASE64 != '' }}
        env:
          TECHMANUAL_BASE_URL_RELEASE: ${{ secrets.TECHMANUAL_BASE_URL_RELEASE }}
          TECHMANUAL_RELEASE_STORE_FILE: keystore/release.jks
          TECHMANUAL_RELEASE_STORE_PASSWORD: ${{ secrets.TECHMANUAL_RELEASE_STORE_PASSWORD }}
          TECHMANUAL_RELEASE_KEY_ALIAS: ${{ secrets.TECHMANUAL_RELEASE_KEY_ALIAS }}
          TECHMANUAL_RELEASE_KEY_PASSWORD: ${{ secrets.TECHMANUAL_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain

      # P1-22: "inspect the actual APK with aapt/apksigner" -- a build that
      # merely completes is not proof the output is actually installable;
      # apksigner verify catches a corrupt/mis-signed APK, and aapt dump
      # confirms the package id and version actually built are what this
      # commit intended.
      - name: Verify signing and inspect the built APK
        if: ${{ secrets.TECHMANUAL_RELEASE_STORE_FILE_BASE64 != '' }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -E "^package:|^application-label:"

      - name: Upload the release APK artifact
        if: ${{ secrets.TECHMANUAL_RELEASE_STORE_FILE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
