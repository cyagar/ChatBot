# Local Docker Compose setup. The database is Postgres/Neon (remote, not
# containerized here) — backend/.env is loaded with env_file below, as real
# process environment variables, not a bind-mounted file: the app container
# runs as a non-root UID (see backend/Dockerfile), and a host file bind-mount
# keeps the host's own ownership/mode, which that UID usually cannot read
# (a real .env owned by the deploying user, mode 600, is not readable by
# a different UID inside the container). env_file has no such problem --
# Compose reads the file itself and injects the values, so the file's host
# permissions never have to be readable by the container's UID at all. Only
# object storage and the Drive download cache are local disk under ./data,
# mounted into the container below -- see docs/DEPLOYMENT_SINGLE_HOST.md for
# the ownership that directory (and the service-account key below) need on a
# freshly cloned host.
#
# Usage:
#   docker compose up --build
#   docker compose exec app python scripts/ingest.py

services:
  app:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    volumes:
      - ./data:/data
      # Google service-account key: this one has to be a real file (the
      # Google auth library reads it by path), so it stays a bind mount --
      # unlike .env above, it must be readable by the container's UID
      # (10001) specifically, not by anyone else on the host. See
      # docs/DEPLOYMENT_SINGLE_HOST.md for the required `chown`.
      # Never baked into the image (backend/.dockerignore blocks *.json).
      # The filename comes from GOOGLE_SERVICE_ACCOUNT_JSON_FILENAME in the root
      # .env (read by `docker compose`, not backend/.env); compose refuses to
      # start when it is unset.
      - ./backend/${GOOGLE_SERVICE_ACCOUNT_JSON_FILENAME:?set GOOGLE_SERVICE_ACCOUNT_JSON_FILENAME in the root .env}:/app/${GOOGLE_SERVICE_ACCOUNT_JSON_FILENAME:?set GOOGLE_SERVICE_ACCOUNT_JSON_FILENAME in the root .env}:ro
    environment:
      - LOCAL_STORAGE_DIR=/data/object_storage
      - GDRIVE_CACHE_DIR=/data/gdrive_cache
      - GOOGLE_SERVICE_ACCOUNT_JSON_PATH=/app/${GOOGLE_SERVICE_ACCOUNT_JSON_FILENAME:?set GOOGLE_SERVICE_ACCOUNT_JSON_FILENAME in the root .env}
      # Compose applies `environment:` after `env_file:`, so this wins even
      # when backend/.env leaves TESSERACT_CMD blank (as .env.example ships
      # it) or sets a host-local path that means nothing inside this image --
      # OCR is silently disabled (app/ingestion/extractors.py) with no
      # binary configured, so this must not be left to whatever .env happens
      # to contain.
      - TESSERACT_CMD=/usr/bin/tesseract
    restart: unless-stopped
    # Bounds a single-instance pilot deployment; raise if ingestion/embedding
    # gets OOM-killed under a larger corpus.
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512
