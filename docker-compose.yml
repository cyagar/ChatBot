# Local Docker Compose setup. Ships the app exactly as built (SQLite +
# local-directory document storage — see docs/ARCHITECTURE.md for why SQLite
# was substituted for Postgres+pgvector on this development machine).
#
# The commented-out `db` service shows the production upgrade path: swap
# STORAGE_BACKEND/DB engine, uncomment, point DATABASE_URL at it, and implement
# app/db_postgres.py behind the same get_conn()-shaped interface used
# throughout app/ — every call site already goes through app/db.py, so no
# route or ingestion code needs to change, only that one module.
#
# Usage:
#   docker compose up --build
#   docker compose exec app python scripts/ingest.py

services:
  app:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./backend/.env:/app/.env:ro
      # Google service-account key: mounted read-only, same pattern as .env.
      # Never baked into the image (backend/.dockerignore blocks *.json).
      # Filename comes from the root .env (GOOGLE_SERVICE_ACCOUNT_JSON_FILENAME,
      # gitignored, read automatically by `docker compose`) so this file stays
      # portable across deployments instead of hard-coding one project's key
      # filename here.
      - ./backend/${GOOGLE_SERVICE_ACCOUNT_JSON_FILENAME}:/app/${GOOGLE_SERVICE_ACCOUNT_JSON_FILENAME}:ro
    environment:
      - DB_PATH=/data/db/app.db
      - LOCAL_STORAGE_DIR=/data/object_storage
      - GDRIVE_CACHE_DIR=/data/gdrive_cache
      - GOOGLE_SERVICE_ACCOUNT_JSON_PATH=/app/${GOOGLE_SERVICE_ACCOUNT_JSON_FILENAME}
    restart: unless-stopped
    # Bounds a single-instance pilot deployment; raise if ingestion/embedding
    # gets OOM-killed under a larger corpus.
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512

