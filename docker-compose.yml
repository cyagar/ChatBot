# Local Docker Compose setup. The database is Postgres/Neon (remote, not
# containerized here) — DATABASE_URL/DATABASE_URL_UNPOOLED come from the
# mounted backend/.env below, read directly by app/config.py's
# pydantic-settings env_file, so they don't need a separate `environment:`
# entry here. Only object storage and the Drive download cache are local
# disk under ./data, mounted into the container below.
#
# Usage:
#   docker compose up --build
#   docker compose exec app python scripts/ingest.py

services:
  app:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./backend/.env:/app/.env:ro
      # Google service-account key: mounted read-only, same pattern as .env.
      # Never baked into the image (backend/.dockerignore blocks *.json).
      # Filename comes from the root .env (GOOGLE_SERVICE_ACCOUNT_JSON_FILENAME,
      # gitignored, read automatically by `docker compose`) so this file stays
      # portable across deployments instead of hard-coding one project's key
      # filename here.
      - ./backend/${GOOGLE_SERVICE_ACCOUNT_JSON_FILENAME}:/app/${GOOGLE_SERVICE_ACCOUNT_JSON_FILENAME}:ro
    environment:
      - LOCAL_STORAGE_DIR=/data/object_storage
      - GDRIVE_CACHE_DIR=/data/gdrive_cache
      - GOOGLE_SERVICE_ACCOUNT_JSON_PATH=/app/${GOOGLE_SERVICE_ACCOUNT_JSON_FILENAME}
    restart: unless-stopped
    # Bounds a single-instance pilot deployment; raise if ingestion/embedding
    # gets OOM-killed under a larger corpus.
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512
